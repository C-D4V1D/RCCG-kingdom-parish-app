<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <meta name="theme-color" content="#0F6E56" />
  <title>RCCG Kingdom Parish — Finance Portal</title>
  <link rel="stylesheet" href="src/css/styles.css" />
</head>
<body>
  <div id="loginScreen" class="login-screen">
    <div class="login-card">
      <div class="login-logo">KP</div>
      <h1 class="login-title">RCCG Kingdom Parish</h1>
      <p class="login-sub">Aguleri — Finance & Accounting Portal</p>
      <div class="login-form">
        <label class="form-label">Select your role</label>
        <select id="roleSelect" class="form-select" onchange="App.onRoleChange()">
          <option value="">— Choose role —</option>
          <option value="it_admin">IT Administrator</option>
          <option value="pastor">Parish Pastor</option>
          <option value="accountant">Church Accountant</option>
          <option value="admin_officer">Admin Officer</option>
          <option value="signatory">Bank Signatory (Elder)</option>
          <option value="viewer">Read-Only Viewer</option>
        </select>
        <div id="userSelectWrap" style="display:none">
          <label class="form-label" style="margin-top:12px">Select your name</label>
          <select id="userSelect" class="form-select"></select>
        </div>
        <label class="form-label" style="margin-top:12px">Enter PIN</label>
        <input type="password" id="pinInput" class="form-input" maxlength="6" placeholder="••••" inputmode="numeric" onkeydown="if(event.key==='Enter')App.login()" />
        <div id="loginError" class="login-error" style="display:none">Incorrect PIN. Please try again.</div>
        <button class="btn btn-primary btn-full" style="margin-top:16px" onclick="App.login()">Sign In</button>
        <p class="login-hint">Demo PINs: IT Admin 0000 · Pastor 1111 · Accountant 2222 · Admin Officer 3333 · Elder 4444</p>
      </div>
    </div>
  </div>

  <div id="appShell" class="app-shell" style="display:none">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-logo">KP</div>
        <div class="sidebar-title-wrap">
          <span class="sidebar-title">RCCG Kingdom Parish</span>
          <span class="sidebar-sub">Admin Team Portal</span>
        </div>
        <button class="sidebar-close" onclick="App.toggleSidebar()">✕</button>
      </div>
      <nav class="sidebar-nav" id="sidebarNav"></nav>
      <div class="sidebar-footer">
        <div class="sidebar-user-row">
          <div class="sidebar-user" id="sidebarUser"></div>
          <button class="btn-logout-icon" onclick="App.logout()" title="Sign Out">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          </button>
        </div>
      </div>
    </aside>
    <div class="sidebar-overlay" id="sidebarOverlay" onclick="App.toggleSidebar()"></div>
    <div class="main-wrap">
      <header class="top-bar">
        <button class="hamburger" onclick="App.toggleSidebar()"><span></span><span></span><span></span></button>
        <div class="top-bar-title" id="topBarTitle">Dashboard</div>
        <div class="top-bar-right">
          <div class="notif-bell" onclick="App.toggleNotifications()">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
            <span class="notif-count" id="notifCount" style="display:none">0</span>
          </div>
          <select id="globalMonth" class="month-select" onchange="App.onMonthChange()"></select>
        </div>
      </header>
      <div class="notif-panel" id="notifPanel" style="display:none">
        <div class="notif-panel-hdr">Notifications <button onclick="App.toggleNotifications()" style="float:right;background:none;border:none;cursor:pointer;font-size:16px">✕</button></div>
        <div id="notifList"></div>
      </div>
      <main class="page-content" id="pageContent"></main>
    </div>
    <nav class="bottom-nav" id="bottomNav"></nav>
  </div>

  <script src="src/js/app.js"></script>
</body>
</html>
