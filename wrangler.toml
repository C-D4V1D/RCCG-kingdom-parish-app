name = "rccg-kingdom-parish-app"
compatibility_date = "2024-01-01"
pages_build_output_dir = "."

[triggers]
# 3rd of each month at 06:00 UTC — auto-draft Happy New Month SMS for next month
# 1st of each month at 07:00 UTC — auto-send the drafted message (within WAT window)
crons = ["0 6 3 * *", "0 7 1 * *"]

# Production (main branch) — live church database
[[d1_databases]]
binding = "DB"
database_name = "rccg-parish-db"
database_id = "dcc63f58-6079-44ba-900c-ff58bc81c4e8"

# Preview deployments (dev, review/*, and all other branches) — separate dev database
[env.preview]
[[env.preview.d1_databases]]
binding = "DB"
database_name = "rccg-parish-db-dev"
database_id = "eb14d315-57c2-4c13-ab9b-7115e7ae7580"
