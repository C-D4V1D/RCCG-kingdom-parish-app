name = "rccg-kingdom-parish-app"
compatibility_date = "2024-01-01"
pages_build_output_dir = "."

# Production (main branch) — live church database
[[d1_databases]]
binding = "DB"
database_name = "rccg-parish-db"
database_id = "dcc63f58-6079-44ba-900c-ff58bc81c4e8"

# Satellite parishes: each has its own database (see SATELLITE PARISHES in functions/api/[[route]].js).
[[d1_databases]]
binding = "SAT_659840"
database_name = "rccg-sat-659840"
database_id = "f52b7118-0cbb-49ee-b47d-7b3cffd8a276"

[[d1_databases]]
binding = "SAT_597445"
database_name = "rccg-sat-597445"
database_id = "82aca844-ca06-468f-9b4b-7be14139a9a4"

[[d1_databases]]
binding = "SAT_761516"
database_name = "rccg-sat-761516"
database_id = "a3ab2f3d-cd9a-45b7-b4b8-8decb2c02206"

# Preview deployments (dev, review/*, and all other branches) — separate dev database
[env.preview]
[[env.preview.d1_databases]]
binding = "DB"
database_name = "rccg-parish-db-dev"
database_id = "eb14d315-57c2-4c13-ab9b-7115e7ae7580"

# Satellite parishes on previews: one shared dev database for all three.
[[env.preview.d1_databases]]
binding = "SAT_659840"
database_name = "rccg-sat-dev"
database_id = "88008e7d-cd7f-42f5-a480-96f5be9da23d"

[[env.preview.d1_databases]]
binding = "SAT_597445"
database_name = "rccg-sat-dev"
database_id = "88008e7d-cd7f-42f5-a480-96f5be9da23d"

[[env.preview.d1_databases]]
binding = "SAT_761516"
database_name = "rccg-sat-dev"
database_id = "88008e7d-cd7f-42f5-a480-96f5be9da23d"
