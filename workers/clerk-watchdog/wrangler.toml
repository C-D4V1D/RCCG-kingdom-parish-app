# clerk-watchdog Worker (deployed separately from the Pages app). Deployed automatically by
# .github/workflows/deploy-watchdog.yml when a change to this folder reaches main (or by hand: `npx wrangler deploy`).
# Secret (set in the Cloudflare dashboard, never in this file): TELEGRAM_BOT_TOKEN for the direct box-down alerts.
name = "clerk-watchdog"
main = "worker.js"
account_id = "63d7bbd4f912ddc7b6272dbda2881a82"
compatibility_date = "2024-09-23"

# Where a changed bank balance is sent for reconciliation (POST /api/internal/run-bank-recon).
[vars]
APP_URL = "https://rccg-kingdom-parish-app.pages.dev"

[[kv_namespaces]]
binding = "KV"
id = "6a977aa2091048e18512cfdb5d3e1008"

# Daily (06:30 UTC): the old AI wake, only if the Telegram alert couldn't be sent. Every 15 min: the box-down checks
# (AI restart wake after the "AI takeover" minutes, then the Telegram alert after "alert after hours").
# Optional secrets for the restart wake (dashboard or `wrangler secret put`): SCHED_WEBHOOK_URL, SCHED_WEBHOOK_KEY.
[triggers]
crons = ["30 6 * * *", "*/15 * * * *"]
