<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#1e3a5f" />
  <title>KPSC Meeting Portal — Kingdom Parish</title>
  <link rel="stylesheet" href="/src/css/kpsc.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>

<!-- LOGIN SCREEN -->
<div id="kpsc-login-screen">
  <div class="kl-hero">
    <div class="kl-cross">✝</div>
    <p class="kl-denom">Redeemed Christian Church of God</p>
    <h1 class="kl-name">Kingdom Parish, Aguleri</h1>
    <p class="kl-portal">KPSC Meeting Portal</p>
    <div class="kl-divider"></div>
    <p class="kl-tagline">Kingdom Parish Stewardship Committee — secure workspace for recording, processing, and archiving committee meetings.</p>
  </div>

  <div class="kl-body">
    <div class="kl-card-wrap">
      <div class="kl-card">
        <h2 class="kl-card-title">Sign In</h2>
        <div id="kpsc-login-error" class="kl-error" style="display:none"></div>
        <label class="kl-label">Committee Member</label>
        <select id="kpsc-account-select" class="kl-input"
          onkeydown="if(event.key==='Enter')document.getElementById('kpsc-pin-input').focus()">
          <option value="">Loading members…</option>
        </select>
        <label class="kl-label">PIN</label>
        <input type="password" id="kpsc-pin-input" class="kl-input" maxlength="6"
          placeholder="••••••" inputmode="numeric"
          onkeydown="if(event.key==='Enter')Kpsc.login(this.closest('.kl-card').querySelector('.kl-submit'))" />
        <button class="kl-submit" onclick="Kpsc.login(this)">Sign In</button>
        <p class="kl-hint">Contact the IT Administrator if you have forgotten your PIN.</p>
      </div>
    </div>
  </div>
</div>

<!-- APP SHELL -->
<div id="kpsc-app" style="display:none">
  <header class="ka-header">
    <button class="ka-back" id="kpsc-back-btn" onclick="Kpsc.goBack()" style="display:none">&#8592; Back</button>
    <div class="ka-title" id="kpsc-page-title">Dashboard</div>
    <div class="ka-right">
      <button class="ka-search-toggle" id="kpsc-search-toggle" onclick="Kpsc.toggleSearch()" title="Search" aria-label="Search" style="display:none">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      </button>
      <span class="ka-user" id="kpsc-user-name"></span>
      <button class="ka-logout" onclick="Kpsc.logout()" title="Sign Out">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      </button>
    </div>
  </header>
  <div id="kpsc-search-overlay" class="ka-search-overlay" style="display:none">
    <div class="ka-search-wrap">
      <input id="kpsc-search-input" class="ka-search-input" type="search" placeholder="Search members, partners, meetings, projects…"
        oninput="Kpsc.onSearchInput(this.value)"
        onkeydown="if(event.key==='Escape')Kpsc.closeSearch()" />
      <button class="ka-search-close" onclick="Kpsc.closeSearch()">✕</button>
    </div>
    <div id="kpsc-search-results" class="ka-search-results"></div>
  </div>

  <main class="ka-main" id="kpsc-main"></main>

  <nav class="ka-nav" id="kpsc-nav">
    <button class="ka-nav-item active" data-group="home" onclick="Kpsc.navigate('dashboard')">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      <span>Home</span>
    </button>
    <button class="ka-nav-item" data-group="meetings" onclick="Kpsc.navigate('meetings')">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      <span>Meetings</span>
    </button>
    <button class="ka-nav-item" data-group="money" onclick="Kpsc.navigate('money')">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
      <span>Money</span>
    </button>
    <button class="ka-nav-item" data-group="more" onclick="Kpsc.navigate('more')">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="5" r="1" fill="currentColor"/><circle cx="12" cy="12" r="1" fill="currentColor"/><circle cx="12" cy="19" r="1" fill="currentColor"/></svg>
      <span>More</span>
    </button>
  </nav>

  <button id="ka-fab" onclick="Kpsc.fabAction()" style="display:none" aria-label="Quick action">+</button>
</div>

<script src="/src/js/kpsc.js"></script>
</body>
</html>
