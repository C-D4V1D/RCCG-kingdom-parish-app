<!doctype html><html><head><meta charset='utf-8'/><meta name='viewport' content='width=device-width,initial-scale=1'/><title>KPSC Byelaw</title><link rel='stylesheet' href='/src/css/kpsc.css'><style>.p-wrap{display:grid;grid-template-columns:240px 1fr;gap:16px;max-width:1100px;margin:auto;padding:16px}.p-side{position:sticky;top:10px;align-self:start;background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:12px}.p-side a{display:block;margin:6px 0}.p-tools{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}@media(max-width:860px){.p-wrap{grid-template-columns:1fr}}</style></head><body><div class='p-wrap'><aside class='p-side'><h3>Sections</h3><input id='q' class='kinput' placeholder='Search in byelaw'><div id='toc'></div></aside><main><h1>KPSC Bylaw & Governance</h1><div id='meta'></div><div class='p-tools'><button onclick='window.print()' class='kbtn'>Download PDF</button><button onclick='expandAll()' class='kbtn kbtn-ghost'>Expand All</button><button onclick='collapseAll()' class='kbtn kbtn-ghost'>Collapse All</button></div><article id='content'>Loading…</article></main></div><script type='module'>const r=await fetch('/api/kpsc-public-policy?type=byelaw').then(x=>x.json()).catch(()=>({}));document.getElementById('meta').textContent=`Version: ${r.version_label||'N/A'} • Effective: ${r.effective_date||'N/A'} • Approved by: ${r.approved_by||'N/A'} • Updated: ${r.approved_at||r.created_at||'N/A'}`;const text=r.full_text||'No published byelaw yet.';const lines=text.split(/\n+/).filter(Boolean);const html=[];const toc=[];let idx=0;for(const ln of lines){if(/^(Article|Section|\d+\.|[A-Z][A-Za-z\s]{3,}:)/.test(ln)){idx++;const id='s'+idx;toc.push(`<a href='#${id}'>${ln.replace(/:$/,'')}</a>`);html.push(`<details open class='p-sec' id='${id}'><summary><b>${ln}</b></summary>`);}else{html.push(`<p>${ln}</p>`);} }html.push('</details>');document.getElementById('content').innerHTML=html.join('');document.getElementById('toc').innerHTML=toc.join('')||'<p>No sections yet.</p>';window.expandAll=()=>document.querySelectorAll('.p-sec').forEach(x=>x.open=true);window.collapseAll=()=>document.querySelectorAll('.p-sec').forEach(x=>x.open=false);document.getElementById('q').addEventListener('input',e=>{const q=e.target.value.toLowerCase().trim();document.querySelectorAll('#content p, #content summary').forEach(el=>{el.style.display=!q||el.textContent.toLowerCase().includes(q)?'':'none';});});</script></body></html>
