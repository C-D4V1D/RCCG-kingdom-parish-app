<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#1e3a5f" />
  <meta name="robots" content="noindex" />
  <title>Install KPSC Meeting Portal</title>
  <link rel="manifest" href="/kpsc/manifest.json" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Lora:wght@600&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --navy:   #1e3a5f;
      --navy2:  #162e4d;
      --gold:   #c9a84c;
      --white:  #ffffff;
      --grey:   #f5f7fb;
      --text:   #1a2535;
      --muted:  #6b7c93;
      --radius: 14px;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--grey);
      color: var(--text);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* ── Header ─────────────────────────────── */
    .hero {
      width: 100%;
      background: linear-gradient(160deg, var(--navy) 0%, var(--navy2) 100%);
      color: var(--white);
      padding: 48px 24px 40px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    .hero-icon {
      width: 88px;
      height: 88px;
      border-radius: 22px;
      background: rgba(255,255,255,0.12);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 44px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.25);
    }

    .hero h1 {
      font-family: 'Lora', serif;
      font-size: 26px;
      line-height: 1.25;
    }

    .hero p {
      font-size: 14px;
      color: rgba(255,255,255,0.75);
      max-width: 320px;
      line-height: 1.55;
    }

    .badge-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
      margin-top: 4px;
    }

    .badge {
      background: rgba(255,255,255,0.15);
      border: 1px solid rgba(255,255,255,0.22);
      border-radius: 20px;
      padding: 4px 12px;
      font-size: 12px;
      letter-spacing: 0.02em;
    }

    /* ── Card ────────────────────────────────── */
    .card {
      background: var(--white);
      border-radius: var(--radius);
      box-shadow: 0 2px 16px rgba(30,58,95,0.09);
      padding: 28px 24px;
      width: 100%;
      max-width: 440px;
      margin: 24px 16px;
    }

    .card h2 {
      font-family: 'Lora', serif;
      font-size: 18px;
      color: var(--navy);
      margin-bottom: 8px;
    }

    .card .subtitle {
      font-size: 13.5px;
      color: var(--muted);
      margin-bottom: 24px;
      line-height: 1.55;
    }

    /* ── Install button ──────────────────────── */
    .btn-install {
      width: 100%;
      padding: 15px;
      background: var(--navy);
      color: var(--white);
      border: none;
      border-radius: 10px;
      font-family: 'DM Sans', sans-serif;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: background 0.15s, transform 0.1s;
    }
    .btn-install:active { transform: scale(0.98); }
    .btn-install:hover  { background: var(--navy2); }
    .btn-install svg    { flex-shrink: 0; }

    .btn-open {
      width: 100%;
      padding: 15px;
      background: #e8f0fe;
      color: var(--navy);
      border: none;
      border-radius: 10px;
      font-family: 'DM Sans', sans-serif;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
      text-decoration: none;
      display: block;
      text-align: center;
    }
    .btn-open:hover { background: #d4e4fd; }

    /* ── iOS step guide ──────────────────────── */
    .steps { display: flex; flex-direction: column; gap: 16px; }

    .step {
      display: flex;
      gap: 14px;
      align-items: flex-start;
    }

    .step-num {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--navy);
      color: var(--white);
      font-size: 14px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      margin-top: 1px;
    }

    .step-body { flex: 1; }

    .step-body strong {
      display: block;
      font-size: 14.5px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 3px;
    }

    .step-body span {
      font-size: 13px;
      color: var(--muted);
      line-height: 1.5;
    }

    .step-icon {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: var(--grey);
      border: 1px solid #dde3ec;
      border-radius: 6px;
      padding: 2px 8px;
      font-size: 12px;
      vertical-align: middle;
    }

    /* ── Browser hint ────────────────────────── */
    .browser-hint {
      background: #fff8e6;
      border: 1px solid #f0d87a;
      border-radius: 10px;
      padding: 14px 16px;
      font-size: 13px;
      color: #6b4f00;
      line-height: 1.55;
      margin-top: 16px;
      display: flex;
      gap: 10px;
      align-items: flex-start;
    }
    .browser-hint svg { flex-shrink: 0; margin-top: 1px; }

    .divider {
      height: 1px;
      background: #eef0f4;
      margin: 20px 0;
    }

    .footnote {
      font-size: 12px;
      color: var(--muted);
      text-align: center;
      padding: 0 24px 32px;
      line-height: 1.6;
    }

    /* ── Already installed ───────────────────── */
    .installed-check {
      text-align: center;
      padding: 8px 0 16px;
    }
    .installed-check svg {
      color: #2e7d32;
      margin-bottom: 12px;
    }
    .installed-check p {
      font-size: 14px;
      color: var(--muted);
      margin-bottom: 20px;
    }

    /* ── Desktop notice ──────────────────────── */
    .desktop-qr { text-align: center; }
    .desktop-qr p { font-size: 14px; color: var(--muted); margin-bottom: 16px; line-height: 1.6; }
    .url-chip {
      display: inline-block;
      background: var(--grey);
      border: 1px solid #dde3ec;
      border-radius: 8px;
      padding: 10px 16px;
      font-size: 13px;
      font-family: monospace;
      color: var(--navy);
      word-break: break-all;
    }
  </style>
</head>
<body>

<div class="hero">
  <div class="hero-icon">✝</div>
  <h1>KPSC Meeting Portal</h1>
  <p>Redeemed Christian Church of God — Kingdom Parish, Aguleri</p>
  <div class="badge-row">
    <span class="badge">Committee Members Only</span>
    <span class="badge">Secure &amp; Private</span>
  </div>
</div>

<!-- Card content is filled by JS based on platform -->
<div class="card" id="install-card">
  <p style="text-align:center;color:#6b7c93;font-size:14px;padding:20px 0">Detecting your device…</p>
</div>

<p class="footnote">
  Kingdom Parish Stewardship Committee &mdash; Kingdom Parish, Aguleri.<br>
  Contact the IT Administrator for access.
</p>

<script>
  const card = document.getElementById('install-card');

  const ua = navigator.userAgent || '';
  const isIOS = /iphone|ipad|ipod/i.test(ua);
  const isAndroid = /android/i.test(ua);
  const isStandalone = window.matchMedia('(display-mode: standalone)').matches || !!navigator.standalone;
  const isChrome = /chrome|chromium/i.test(ua) && !/edg/i.test(ua);
  const isSafari = /safari/i.test(ua) && !/chrome|crios|fxios/i.test(ua);
  const isMobile = isIOS || isAndroid;

  // Register service worker (needed for Chrome install eligibility)
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/kpsc/sw.js', {
      scope: '/kpsc/',
      updateViaCache: 'none'
    }).then(registration => {
      registration.update().catch(() => {});
    }).catch(() => {});
  }

  // ── Already installed as standalone app ─────────────────────────
  if (isStandalone) {
    card.innerHTML = `
      <div class="installed-check">
        <svg width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <circle cx="12" cy="12" r="10"/>
          <polyline points="9 12 11 14 15 10"/>
        </svg>
        <h2 style="margin-bottom:12px">Already Installed</h2>
        <p>The KPSC Portal is already installed on this device.</p>
        <a href="/kpsc/" class="btn-open">Open the App</a>
      </div>`;
    return;
  }

  // ── Android / Chrome — native install prompt ─────────────────────
  if (isAndroid) {
    let deferredPrompt = null;

    const androidHTML = `
      <h2>Install on Android</h2>
      <p class="subtitle">Add KPSC to your home screen for quick, app-like access — no App Store needed.</p>
      <button class="btn-install" id="btn-android-install" disabled>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <path d="M12 2v13M7 10l5 5 5-5"/><path d="M20 17v2a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-2"/>
        </svg>
        <span id="install-btn-label">Preparing…</span>
      </button>
      <div id="android-hint" class="browser-hint" style="display:none">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
        <span>Open this page in <strong>Chrome</strong> to use the install button.</span>
      </div>`;

    card.innerHTML = androidHTML;

    const installBtn = document.getElementById('btn-android-install');
    const label = document.getElementById('install-btn-label');
    const hint = document.getElementById('android-hint');

    if (!isChrome) {
      installBtn.style.display = 'none';
      hint.style.display = 'flex';
    }

    window.addEventListener('beforeinstallprompt', e => {
      e.preventDefault();
      deferredPrompt = e;
      installBtn.disabled = false;
      label.textContent = 'Install App';
    });

    // If prompt doesn't fire after 3s, show fallback menu instructions
    setTimeout(() => {
      if (!deferredPrompt && isChrome) {
        label.textContent = 'Add to Home Screen';
        installBtn.disabled = false;
        installBtn.onclick = () => {
          card.innerHTML = `
            <h2>Add via Chrome Menu</h2>
            <p class="subtitle">Chrome's install prompt may have already appeared, or use the menu:</p>
            <div class="steps">
              <div class="step">
                <div class="step-num">1</div>
                <div class="step-body">
                  <strong>Tap the menu</strong>
                  <span>Tap the <span class="step-icon">⋮</span> three-dot menu at the top right of Chrome.</span>
                </div>
              </div>
              <div class="step">
                <div class="step-num">2</div>
                <div class="step-body">
                  <strong>Select "Add to Home screen"</strong>
                  <span>Scroll down the menu and tap <strong>Add to Home screen</strong>.</span>
                </div>
              </div>
              <div class="step">
                <div class="step-num">3</div>
                <div class="step-body">
                  <strong>Tap "Add"</strong>
                  <span>Confirm by tapping <strong>Add</strong> in the prompt.</span>
                </div>
              </div>
            </div>`;
        };
      }
    }, 3000);

    installBtn.addEventListener('click', async () => {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      const { outcome } = await deferredPrompt.userChoice;
      deferredPrompt = null;
      if (outcome === 'accepted') {
        card.innerHTML = `
          <div class="installed-check">
            <svg width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <circle cx="12" cy="12" r="10"/>
              <polyline points="9 12 11 14 15 10"/>
            </svg>
            <h2 style="margin-bottom:12px">Installing…</h2>
            <p>KPSC Portal has been added to your home screen.</p>
            <a href="/kpsc/" class="btn-open">Open the App</a>
          </div>`;
      }
    });

    window.addEventListener('appinstalled', () => {
      setTimeout(() => { window.location.href = '/kpsc/'; }, 1200);
    });

    return;
  }

  // ── iOS / Safari — step-by-step guide ───────────────────────────
  if (isIOS) {
    const notSafari = !isSafari;
    card.innerHTML = `
      <h2>Add to Home Screen</h2>
      <p class="subtitle">Follow these three steps in <strong>Safari</strong> to install the KPSC Portal on your iPhone or iPad.</p>
      ${notSafari ? `
        <div class="browser-hint">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
          </svg>
          <span>Open this link in <strong>Safari</strong> (not Chrome or Firefox) to install the app.</span>
        </div>
        <div class="divider"></div>
      ` : ''}
      <div class="steps">
        <div class="step">
          <div class="step-num">1</div>
          <div class="step-body">
            <strong>Tap the Share button</strong>
            <span>At the bottom of Safari, tap the
              <span class="step-icon">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
                  <path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/>
                  <polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/>
                </svg>
                Share
              </span>
              icon.
            </span>
          </div>
        </div>
        <div class="step">
          <div class="step-num">2</div>
          <div class="step-body">
            <strong>Tap "Add to Home Screen"</strong>
            <span>Scroll down in the share sheet and tap
              <span class="step-icon">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
                  <rect x="3" y="3" width="18" height="18" rx="2"/>
                  <line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/>
                </svg>
                Add to Home Screen
              </span>.
            </span>
          </div>
        </div>
        <div class="step">
          <div class="step-num">3</div>
          <div class="step-body">
            <strong>Tap "Add" to confirm</strong>
            <span>In the top-right corner of the screen, tap <strong>Add</strong>. The KPSC Portal icon will appear on your home screen.</span>
          </div>
        </div>
      </div>
      <div class="divider"></div>
      <a href="/kpsc/" class="btn-open">Skip — Open in Browser</a>`;

    return;
  }

  // ── Desktop or other browser ─────────────────────────────────────
  card.innerHTML = `
    <div class="desktop-qr">
      <h2 style="margin-bottom:8px">Open on your phone</h2>
      <p>The KPSC Portal is designed for phones. Open the link below on your Android or iPhone to install it.</p>
      <div class="url-chip">${window.location.origin}/kpsc/install/</div>
      <div class="divider"></div>
      <a href="/kpsc/" class="btn-open" style="max-width:240px;margin:0 auto">Open in This Browser</a>
    </div>`;
</script>
</body>
</html>
