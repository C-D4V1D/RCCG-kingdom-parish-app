name: Cron — Follow-ups & Pre-briefs

# Runs every 30 minutes and hits several internal Pages endpoints (each one
# internally checks the day of month / send window and no-ops when it's not
# time to run):
#   POST /api/internal/run-followups                 — overdue nudge drafts (B5)
#   POST /api/internal/run-prebriefs                  — pre-meeting briefs (B6)
#   POST /api/internal/run-monthly-sms                — Happy New Month SMS (1st); also
#                                                        drafts next month's message right
#                                                        after a successful send
#   POST /api/internal/run-newmonth-draft-fallback    — retries the next-month draft on the
#                                                        3rd if the day-1 draft failed
#   POST /api/internal/run-reminder-sms               — payment reminder SMS
#   POST /api/internal/run-anniversary-sms            — partner anniversary SMS
#   POST /api/internal/run-premeeting-sms             — pre-meeting member SMS
#   POST /api/internal/run-actionitem-sms             — action item deadline SMS
#   POST /api/internal/run-scheduled-sms              — scheduled SMS blasts
#
# Required GitHub repo secrets:
#   KPSC_APP_URL    — production Pages URL, e.g. https://kpsc.example.com
#   CRON_SECRET     — random token (same value set in Cloudflare Pages env vars)
#
# To set up:
#   gh secret set KPSC_APP_URL  --body "https://your-site.pages.dev"
#   gh secret set CRON_SECRET   --body "$(openssl rand -hex 32)"
#
# Then add the SAME CRON_SECRET value to Cloudflare Pages:
#   Pages dashboard → Settings → Environment Variables → CRON_SECRET

# Each step uses `continue-on-error: true` so that one failing endpoint (e.g. a
# transient error in run-monthly-sms) never prevents the later steps — most
# importantly the payment-reminder send — from running. Failures still surface
# as ::error:: annotations on the run.

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:   # allow manual trigger for testing

jobs:
  run-cron:
    name: Trigger follow-ups and pre-briefs
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Run follow-up nudge generation (B5)
        continue-on-error: true
        run: |
          echo "Hitting /api/internal/run-followups …"
          RESPONSE=$(curl -sS -w "\nHTTP_STATUS:%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            "${{ secrets.KPSC_APP_URL }}/api/internal/run-followups")
          HTTP_STATUS=$(echo "$RESPONSE" | grep "HTTP_STATUS:" | cut -d: -f2)
          BODY=$(echo "$RESPONSE" | grep -v "HTTP_STATUS:")
          echo "Status: $HTTP_STATUS"
          echo "Body: $BODY"
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "::error::run-followups returned HTTP $HTTP_STATUS"
            exit 1
          fi

      - name: Run pre-meeting brief generation (B6)
        continue-on-error: true
        run: |
          echo "Hitting /api/internal/run-prebriefs …"
          RESPONSE=$(curl -sS -w "\nHTTP_STATUS:%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            "${{ secrets.KPSC_APP_URL }}/api/internal/run-prebriefs")
          HTTP_STATUS=$(echo "$RESPONSE" | grep "HTTP_STATUS:" | cut -d: -f2)
          BODY=$(echo "$RESPONSE" | grep -v "HTTP_STATUS:")
          echo "Status: $HTTP_STATUS"
          echo "Body: $BODY"
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "::error::run-prebriefs returned HTTP $HTTP_STATUS"
            exit 1
          fi

      - name: Run Happy New Month SMS (1st of each month)
        continue-on-error: true
        run: |
          echo "Hitting /api/internal/run-monthly-sms …"
          RESPONSE=$(curl -sS -w "\nHTTP_STATUS:%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            "${{ secrets.KPSC_APP_URL }}/api/internal/run-monthly-sms")
          HTTP_STATUS=$(echo "$RESPONSE" | grep "HTTP_STATUS:" | cut -d: -f2)
          BODY=$(echo "$RESPONSE" | grep -v "HTTP_STATUS:")
          echo "Status: $HTTP_STATUS"
          echo "Body: $BODY"
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "::error::run-monthly-sms returned HTTP $HTTP_STATUS"
            exit 1
          fi

      - name: Run new-month draft fallback (day 3 backup)
        continue-on-error: true
        run: |
          echo "Hitting /api/internal/run-newmonth-draft-fallback …"
          RESPONSE=$(curl -sS -w "\nHTTP_STATUS:%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            "${{ secrets.KPSC_APP_URL }}/api/internal/run-newmonth-draft-fallback")
          HTTP_STATUS=$(echo "$RESPONSE" | grep "HTTP_STATUS:" | cut -d: -f2)
          BODY=$(echo "$RESPONSE" | grep -v "HTTP_STATUS:")
          echo "Status: $HTTP_STATUS"
          echo "Body: $BODY"
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "::error::run-newmonth-draft-fallback returned HTTP $HTTP_STATUS"
            exit 1
          fi

      - name: Run partner payment reminder SMS
        continue-on-error: true
        run: |
          echo "Hitting /api/internal/run-reminder-sms …"
          RESPONSE=$(curl -sS -w "\nHTTP_STATUS:%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            "${{ secrets.KPSC_APP_URL }}/api/internal/run-reminder-sms")
          HTTP_STATUS=$(echo "$RESPONSE" | grep "HTTP_STATUS:" | cut -d: -f2)
          BODY=$(echo "$RESPONSE" | grep -v "HTTP_STATUS:")
          echo "Status: $HTTP_STATUS"
          echo "Body: $BODY"
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "::error::run-reminder-sms returned HTTP $HTTP_STATUS"
            exit 1
          fi

      - name: Run partner anniversary SMS (Feature 4)
        continue-on-error: true
        run: |
          echo "Hitting /api/internal/run-anniversary-sms …"
          RESPONSE=$(curl -sS -w "\nHTTP_STATUS:%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            "${{ secrets.KPSC_APP_URL }}/api/internal/run-anniversary-sms")
          HTTP_STATUS=$(echo "$RESPONSE" | grep "HTTP_STATUS:" | cut -d: -f2)
          BODY=$(echo "$RESPONSE" | grep -v "HTTP_STATUS:")
          echo "Status: $HTTP_STATUS"
          echo "Body: $BODY"
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "::error::run-anniversary-sms returned HTTP $HTTP_STATUS"
            exit 1
          fi

      - name: Run pre-meeting member SMS (Feature 7)
        continue-on-error: true
        run: |
          echo "Hitting /api/internal/run-premeeting-sms …"
          RESPONSE=$(curl -sS -w "\nHTTP_STATUS:%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            "${{ secrets.KPSC_APP_URL }}/api/internal/run-premeeting-sms")
          HTTP_STATUS=$(echo "$RESPONSE" | grep "HTTP_STATUS:" | cut -d: -f2)
          BODY=$(echo "$RESPONSE" | grep -v "HTTP_STATUS:")
          echo "Status: $HTTP_STATUS"
          echo "Body: $BODY"
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "::error::run-premeeting-sms returned HTTP $HTTP_STATUS"
            exit 1
          fi

      - name: Run action item deadline SMS (Feature 9)
        continue-on-error: true
        run: |
          echo "Hitting /api/internal/run-actionitem-sms …"
          RESPONSE=$(curl -sS -w "\nHTTP_STATUS:%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            "${{ secrets.KPSC_APP_URL }}/api/internal/run-actionitem-sms")
          HTTP_STATUS=$(echo "$RESPONSE" | grep "HTTP_STATUS:" | cut -d: -f2)
          BODY=$(echo "$RESPONSE" | grep -v "HTTP_STATUS:")
          echo "Status: $HTTP_STATUS"
          echo "Body: $BODY"
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "::error::run-actionitem-sms returned HTTP $HTTP_STATUS"
            exit 1
          fi

      - name: Run scheduled SMS blast (Feature 10)
        continue-on-error: true
        run: |
          echo "Hitting /api/internal/run-scheduled-sms …"
          RESPONSE=$(curl -sS -w "\nHTTP_STATUS:%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            "${{ secrets.KPSC_APP_URL }}/api/internal/run-scheduled-sms")
          HTTP_STATUS=$(echo "$RESPONSE" | grep "HTTP_STATUS:" | cut -d: -f2)
          BODY=$(echo "$RESPONSE" | grep -v "HTTP_STATUS:")
          echo "Status: $HTTP_STATUS"
          echo "Body: $BODY"
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "::error::run-scheduled-sms returned HTTP $HTTP_STATUS"
            exit 1
          fi
