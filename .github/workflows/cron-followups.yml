name: Cron — Follow-ups & Pre-briefs

# Runs every 30 minutes and hits two internal Pages endpoints:
#   POST /api/internal/run-followups  — generates overdue nudge drafts (B5)
#   POST /api/internal/run-prebriefs  — generates pre-meeting briefs (B6)
#
# Required GitHub repo secrets:
#   KPSC_APP_URL    — production Pages URL, e.g. https://kpsc.example.com
#   CRON_SECRET     — random token (same value set in Cloudflare Pages env vars)
#
# To set up:
#   gh secret set KPSC_APP_URL  --body "https://your-site.pages.dev"
#   gh secret set CRON_SECRET   --body "$(openssl rand -hex 32)"
#
# Then add the SAME CRON_SECRET value to Cloudflare Pages:
#   Pages dashboard → Settings → Environment Variables → CRON_SECRET

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:   # allow manual trigger for testing

jobs:
  run-cron:
    name: Trigger follow-ups and pre-briefs
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Run follow-up nudge generation (B5)
        run: |
          echo "Hitting /api/internal/run-followups …"
          RESPONSE=$(curl -sS -w "\nHTTP_STATUS:%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            "${{ secrets.KPSC_APP_URL }}/api/internal/run-followups")
          HTTP_STATUS=$(echo "$RESPONSE" | grep "HTTP_STATUS:" | cut -d: -f2)
          BODY=$(echo "$RESPONSE" | grep -v "HTTP_STATUS:")
          echo "Status: $HTTP_STATUS"
          echo "Body: $BODY"
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "::error::run-followups returned HTTP $HTTP_STATUS"
            exit 1
          fi

      - name: Run pre-meeting brief generation (B6)
        run: |
          echo "Hitting /api/internal/run-prebriefs …"
          RESPONSE=$(curl -sS -w "\nHTTP_STATUS:%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            "${{ secrets.KPSC_APP_URL }}/api/internal/run-prebriefs")
          HTTP_STATUS=$(echo "$RESPONSE" | grep "HTTP_STATUS:" | cut -d: -f2)
          BODY=$(echo "$RESPONSE" | grep -v "HTTP_STATUS:")
          echo "Status: $HTTP_STATUS"
          echo "Body: $BODY"
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "::error::run-prebriefs returned HTTP $HTTP_STATUS"
            exit 1
          fi

      - name: Run Happy New Month SMS (1st of each month)
        run: |
          echo "Hitting /api/internal/run-monthly-sms …"
          RESPONSE=$(curl -sS -w "\nHTTP_STATUS:%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            "${{ secrets.KPSC_APP_URL }}/api/internal/run-monthly-sms")
          HTTP_STATUS=$(echo "$RESPONSE" | grep "HTTP_STATUS:" | cut -d: -f2)
          BODY=$(echo "$RESPONSE" | grep -v "HTTP_STATUS:")
          echo "Status: $HTTP_STATUS"
          echo "Body: $BODY"
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "::error::run-monthly-sms returned HTTP $HTTP_STATUS"
            exit 1
          fi

      - name: Run partner payment reminder SMS
        run: |
          echo "Hitting /api/internal/run-reminder-sms …"
          RESPONSE=$(curl -sS -w "\nHTTP_STATUS:%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            "${{ secrets.KPSC_APP_URL }}/api/internal/run-reminder-sms")
          HTTP_STATUS=$(echo "$RESPONSE" | grep "HTTP_STATUS:" | cut -d: -f2)
          BODY=$(echo "$RESPONSE" | grep -v "HTTP_STATUS:")
          echo "Status: $HTTP_STATUS"
          echo "Body: $BODY"
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "::error::run-reminder-sms returned HTTP $HTTP_STATUS"
            exit 1
          fi
