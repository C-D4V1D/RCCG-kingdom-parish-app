name: Cron — Follow-ups & Pre-briefs

# Polls several internal Pages endpoints on a timer. Each endpoint checks for
# itself whether there is anything to do (day of month, send window, whether the
# job has already run this period) and no-ops otherwise, so hitting them all on
# every tick is cheap and safe.
#
#   POST /api/internal/run-followups                 — overdue nudge drafts (B5)
#   POST /api/internal/run-prebriefs                 — pre-meeting briefs (B6)
#   POST /api/internal/run-monthly-sms               — Happy New Month SMS (due from
#                                                       the 1st, once per month); also
#                                                       drafts next month's message
#   POST /api/internal/run-newmonth-draft-fallback   — backstop that makes sure next
#                                                       month's draft exists
#   POST /api/internal/run-reminder-sms              — payment reminder SMS
#   POST /api/internal/run-anniversary-sms           — partner anniversary SMS
#   POST /api/internal/run-premeeting-sms            — pre-meeting member SMS
#   POST /api/internal/run-actionitem-sms            — action item deadline SMS
#   POST /api/internal/run-scheduled-sms             — scheduled SMS blasts
#
# ── Required configuration ────────────────────────────────────────────────────
#   CRON_SECRET   (repo secret)  — random token; the SAME value must be set as an
#                                  environment variable in Cloudflare Pages
#                                  (Pages dashboard → Settings → Environment Variables).
#   KPSC_APP_URL  (repo variable or secret, OPTIONAL) — overrides the production URL
#                                  below; only needed to point at a preview deployment.
#
#   gh secret set CRON_SECRET --body "$(openssl rand -hex 32)"
#
# ── Why the preflight step exists ─────────────────────────────────────────────
# Every step used to be `continue-on-error: true` and to build its URL by
# interpolating `${{ secrets.KPSC_APP_URL }}` directly. When those secrets went
# missing the curls became `curl ""` — "URL rejected: No host part in the URL",
# exit 3 — and `continue-on-error` turned every one of those failures green. The
# workflow reported success on ~2,000 consecutive runs while doing nothing at
# all, and two months of payment reminders and one Happy New Month send were
# lost before anyone noticed. So now:
#   * the app URL has a real default and can no longer be empty;
#   * a preflight step fails the job outright if CRON_SECRET is missing;
#   * the endpoints still all run even when an earlier one fails (a transient
#     error in one job must never block the payment reminder), but any failure
#     now fails the job, so a broken scheduler shows up as a red X.

on:
  schedule:
    # Best effort only. GitHub throttles `schedule` heavily and in practice
    # delivers a handful of these ticks per day at unpredictable times, so the
    # endpoints must never depend on being polled at a particular moment — they
    # stay "due" until they have actually run and catch up on a later tick.
    - cron: "*/30 * * * *"
  workflow_dispatch:   # allow manual trigger for testing

concurrency:
  # Two overlapping runs would send the same SMS batch twice.
  group: kpsc-cron
  cancel-in-progress: false

jobs:
  run-cron:
    name: Trigger follow-ups and pre-briefs
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      # A missing KPSC_APP_URL must not be able to break the scheduler, so the
      # production URL is the default. It is public (it is in docs/ already);
      # only CRON_SECRET is sensitive.
      APP_URL: ${{ vars.KPSC_APP_URL || secrets.KPSC_APP_URL || 'https://rccg-kingdom-parish-app.pages.dev' }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}

    steps:
      - name: Preflight — configuration is present
        run: |
          FAIL=0
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET repository secret is not set. Every internal cron endpoint will reject with 401 and no automated SMS will be sent. Set it with: gh secret set CRON_SECRET --body \"\$(openssl rand -hex 32)\" and add the SAME value as a CRON_SECRET environment variable in Cloudflare Pages."
            FAIL=1
          fi
          case "$APP_URL" in
            https://*) ;;
            *) echo "::error::APP_URL is not an https URL (got '$APP_URL')."; FAIL=1 ;;
          esac
          echo "App URL: $APP_URL"
          exit $FAIL

      - name: Poll internal cron endpoints
        run: |
          set -uo pipefail
          ENDPOINTS="
          run-followups
          run-prebriefs
          run-monthly-sms
          run-newmonth-draft-fallback
          run-reminder-sms
          run-anniversary-sms
          run-premeeting-sms
          run-actionitem-sms
          run-scheduled-sms
          "
          FAILED=""
          for ep in $ENDPOINTS; do
            URL="${APP_URL%/}/api/internal/$ep"
            echo "──────── $ep ────────"
            # --retry rides out a cold Pages isolate or a blip; --max-time keeps
            # one slow endpoint from eating the whole job's budget.
            BODY=$(curl -sS \
              --retry 3 --retry-delay 5 --retry-connrefused --max-time 240 \
              -o /tmp/cron-body.txt -w '%{http_code}' \
              -X POST \
              -H "Authorization: Bearer $CRON_SECRET" \
              -H "Content-Type: application/json" \
              "$URL") || BODY="000"
            echo "Status: $BODY"
            echo "Body: $(head -c 2000 /tmp/cron-body.txt)"
            if [ "$BODY" != "200" ]; then
              echo "::error::$ep returned HTTP $BODY"
              FAILED="$FAILED $ep"
            fi
          done
          if [ -n "$FAILED" ]; then
            echo "::error::Cron endpoints failed:$FAILED"
            exit 1
          fi
          echo "All endpoints returned 200."
