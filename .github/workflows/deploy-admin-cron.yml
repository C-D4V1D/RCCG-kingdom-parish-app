name: Deploy admin-cron Worker

# Deploys workers/admin-cron to Cloudflare whenever a change to it reaches main, after the tests pass, so nobody
# has to deploy the scheduler by hand. Can also be run from the Actions tab ("Run workflow").
#
# Needs one repository secret: CLOUDFLARE_API_TOKEN (a Cloudflare API token made from the "Edit Cloudflare Workers"
# template). Without it the job skips the deploy with a notice instead of failing.
# The Worker's own secret CRON_SECRET lives in Cloudflare (dashboard), not here; deploys keep it.

on:
  push:
    branches: [main]
    paths:
      - "workers/admin-cron/**"
      - ".github/workflows/deploy-admin-cron.yml"
  workflow_dispatch:

concurrency:
  group: deploy-admin-cron
  cancel-in-progress: false

jobs:
  deploy:
    name: Test and deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Scheduler tests
        run: node --test tests/admin-cron-worker.test.js

      - name: Check the Cloudflare key is set
        id: key
        env:
          CF: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$CF" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CLOUDFLARE_API_TOKEN is not set in the repository secrets, so the scheduler was not deployed."
          fi

      - name: Deploy
        if: steps.key.outputs.ok == 'true'
        working-directory: workers/admin-cron
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@4 deploy

      - name: Show the deployed version
        if: steps.key.outputs.ok == 'true'
        working-directory: workers/admin-cron
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@4 deployments list | tail -n 12
